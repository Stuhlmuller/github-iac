name: Clean Cancelled Homelab Ruleset Plan

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main commit containing the fixed cleanup target
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-iac-deploy
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ inputs.expected_sha }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact current main and cleanup tests
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          python3 -I Stuhlmuller/repositories/cleanup-cancelled-plan-test.py

  inspect:
    runs-on: ubuntu-latest
    needs: checks
    environment: github-iac-plan
    permissions:
      contents: read
      id-token: write
    outputs:
      version_id: ${{ steps.artifact.outputs.version_id }}
      sha256: ${{ steps.artifact.outputs.sha256 }}
      kms_key_id: ${{ steps.artifact.outputs.kms_key_id }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact current main commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::716182248480:role/Github-TF-State
          role-session-name: github-iac-plan-cleanup-inspect
          inline-session-policy: |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": "s3:ListBucketVersions",
                  "Resource": "arn:aws:s3:::rstuhlmuller-aws-s3-use1-datalake",
                  "Condition": {"StringEquals": {"s3:prefix": "IaC/github-iac/saved-plans/3895951caad2f0828c9479e2ead97f8d56d38c14/44247272941-1/plan.out"}}
                },
                {
                  "Effect": "Allow",
                  "Action": "s3:GetObjectVersion",
                  "Resource": "arn:aws:s3:::rstuhlmuller-aws-s3-use1-datalake/IaC/github-iac/saved-plans/3895951caad2f0828c9479e2ead97f8d56d38c14/44247272941-1/plan.out"
                },
                {
                  "Effect": "Allow",
                  "Action": "kms:Decrypt",
                  "Resource": "arn:aws:kms:us-east-1:716182248480:key/*",
                  "Condition": {"StringEquals": {"kms:ViaService": "s3.us-east-1.amazonaws.com"}}
                }
              ]
            }

      - name: Inspect exact encrypted plan version
        id: artifact
        shell: bash
        run: python3 -I Stuhlmuller/repositories/cleanup-cancelled-plan.py inspect

  delete:
    runs-on: ubuntu-latest
    needs: inspect
    environment: github-iac-production
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_VERSION: ${{ needs.inspect.outputs.version_id }}
      EXPECTED_PLAN_SHA256: ${{ needs.inspect.outputs.sha256 }}
      EXPECTED_KMS_KEY_ID: ${{ needs.inspect.outputs.kms_key_id }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact current main commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::716182248480:role/Github-TF-State
          role-session-name: github-iac-plan-cleanup-delete

      - name: Delete only the reviewed encrypted plan version
        shell: bash
        run: >-
          python3 -I Stuhlmuller/repositories/cleanup-cancelled-plan.py delete
          --expected-version "$EXPECTED_VERSION"
          --expected-sha256 "$EXPECTED_PLAN_SHA256"
          --expected-kms-key-id "$EXPECTED_KMS_KEY_ID"
          --expected-main-sha "$EXPECTED_SHA"
