name: "Terragrunt Check"

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
    paths:
      - 'Stuhlmuller/**'
      - 'modules/github_repositories/**'
      - 'common.yml'
      - 'mise.toml'
      - 'root.hcl'
      - '.github/workflows/plan.yml'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          persist-credentials: false

      - name: Check Terragrunt HCL
        uses: gruntwork-io/terragrunt-action@4ed5b7344c80315e5357f28f36159fc980bc2d5a # v3
        with:
          tg_dir: Stuhlmuller
          tg_command: 'hcl fmt --check --diff'

      - name: Check OpenTofu module
        run: |
          tofu fmt -check -recursive
          tofu -chdir=modules/github_repositories init -backend=false -input=false
          tofu -chdir=modules/github_repositories validate
