name: Reconcile Homelab Plan Reviewer

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit SHA currently at main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-iac-deploy
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ inputs.expected_sha }}
  PLAN_BUCKET: rstuhlmuller-aws-s3-use1-datalake
  WORKING_DIR: Stuhlmuller/repositories
  TARGET_ADDRESS: github_repository_environment.this["homelab.homelab-plan"]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact current main commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"

      - name: Check Terragrunt HCL
        uses: gruntwork-io/terragrunt-action@4ed5b7344c80315e5357f28f36159fc980bc2d5a # v3
        with:
          tg_dir: Stuhlmuller
          tg_command: 'hcl fmt --check --diff'

  plan:
    runs-on: ubuntu-latest
    needs: checks
    environment: github-iac-plan
    permissions:
      contents: read
      id-token: write
    outputs:
      changed: ${{ steps.verify.outputs.changed }}
      plan_key: ${{ steps.store.outputs.plan_key }}
      plan_sha256: ${{ steps.store.outputs.plan_sha256 }}
      plan_version_id: ${{ steps.store.outputs.plan_version_id }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact current main commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"

      - name: Install pinned tools
        uses: gruntwork-io/terragrunt-action@4ed5b7344c80315e5357f28f36159fc980bc2d5a # v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::716182248480:role/Github-TF-State
          role-session-name: github-iac-plan

      - name: Create read-only GitHub App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homelab
          permission-administration: read

      - name: Adopt environment state only if absent
        shell: bash
        working-directory: ${{ env.WORKING_DIR }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TG_NON_INTERACTIVE: true
          TF_IN_AUTOMATION: 1
        run: |
          set -euo pipefail
          gh api repos/Stuhlmuller/homelab/environments/homelab-plan >/dev/null
          state_addresses="$(terragrunt state list)"
          if ! grep -Fxq -- "$TARGET_ADDRESS" <<<"$state_addresses"; then
            git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin main
            test "$(git -C "$GITHUB_WORKSPACE" rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
            terragrunt import "$TARGET_ADDRESS" homelab:homelab-plan
          fi

      - name: Plan only the homelab-plan environment
        shell: bash
        working-directory: ${{ env.WORKING_DIR }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TG_NON_INTERACTIVE: true
          TF_IN_AUTOMATION: 1
          PLAN_FILE: ${{ runner.temp }}/homelab-plan-reviewer.tfplan
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin main
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          terragrunt plan -input=false -out="$PLAN_FILE" -target="$TARGET_ADDRESS"

      - name: Verify saved plan scope and current environment
        id: verify
        shell: bash
        working-directory: ${{ env.WORKING_DIR }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PLAN_FILE: ${{ runner.temp }}/homelab-plan-reviewer.tfplan
        run: |
          set -euo pipefail
          policy="$GITHUB_WORKSPACE/Stuhlmuller/repositories/homelab-plan-reviewer-policy.jq"
          terragrunt show -json "$PLAN_FILE" > plan.json
          jq -e -S -c --arg source plan --arg phase before -f "$policy" plan.json > plan-before.json
          jq -e -S -c --arg source plan --arg phase after -f "$policy" plan.json > plan-after.json
          gh api repos/Stuhlmuller/homelab/environments/homelab-plan > live-before.json
          jq -e -S -c --arg source live -f "$policy" live-before.json > live-before-normalized.json
          cmp plan-before.json live-before-normalized.json
          changed="$(jq -r '[.resource_changes[]? | select(.mode == "managed" and .change.actions != ["no-op"])] | length == 1' plan.json)"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          terragrunt show -no-color "$PLAN_FILE"

      - name: Store encrypted saved plan
        if: steps.verify.outputs.changed == 'true'
        id: store
        shell: bash
        env:
          PLAN_FILE: ${{ runner.temp }}/homelab-plan-reviewer.tfplan
        run: |
          set -euo pipefail
          plan_key="IaC/github-iac/saved-plans/homelab-plan-reviewer/$EXPECTED_SHA/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/plan.out"
          plan_sha256="$(sha256sum "$PLAN_FILE" | awk '{print $1}')"
          aws s3 cp "$PLAN_FILE" "s3://$PLAN_BUCKET/$plan_key" \
            --only-show-errors \
            --sse aws:kms \
            --sse-kms-key-id alias/homelab-opentofu \
            --metadata "commit=$EXPECTED_SHA,run-id=$GITHUB_RUN_ID,sha256=$plan_sha256"
          plan_version_id="$(aws s3api head-object --bucket "$PLAN_BUCKET" --key "$plan_key" --query VersionId --output text)"
          test -n "$plan_version_id"
          test "$plan_version_id" != None
          {
            echo "plan_key=$plan_key"
            echo "plan_sha256=$plan_sha256"
            echo "plan_version_id=$plan_version_id"
          } >> "$GITHUB_OUTPUT"

  apply:
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-latest
    needs: plan
    environment: github-iac-production
    permissions:
      contents: read
      id-token: write
    env:
      PLAN_KEY: ${{ needs.plan.outputs.plan_key }}
      PLAN_SHA256: ${{ needs.plan.outputs.plan_sha256 }}
      PLAN_VERSION_ID: ${{ needs.plan.outputs.plan_version_id }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact current main commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"

      - name: Install pinned tools
        uses: gruntwork-io/terragrunt-action@4ed5b7344c80315e5357f28f36159fc980bc2d5a # v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::716182248480:role/Github-TF-State
          role-session-name: github-iac-apply

      - name: Download and verify exact saved plan
        shell: bash
        env:
          PLAN_FILE: ${{ runner.temp }}/homelab-plan-reviewer.tfplan
        run: |
          set -euo pipefail
          expected_key="IaC/github-iac/saved-plans/homelab-plan-reviewer/$EXPECTED_SHA/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/plan.out"
          test "$PLAN_KEY" = "$expected_key"
          [[ "$PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test -n "$PLAN_VERSION_ID"
          test "$PLAN_VERSION_ID" != None
          aws s3api head-object \
            --bucket "$PLAN_BUCKET" --key "$PLAN_KEY" --version-id "$PLAN_VERSION_ID" > plan-head.json
          jq -e \
            --arg commit "$EXPECTED_SHA" --arg run_id "$GITHUB_RUN_ID" \
            --arg sha256 "$PLAN_SHA256" --arg version_id "$PLAN_VERSION_ID" '
            .ServerSideEncryption == "aws:kms"
            and .VersionId == $version_id
            and .Metadata.commit == $commit
            and .Metadata["run-id"] == $run_id
            and .Metadata.sha256 == $sha256
          ' plan-head.json
          aws s3api get-object \
            --bucket "$PLAN_BUCKET" --key "$PLAN_KEY" --version-id "$PLAN_VERSION_ID" \
            "$PLAN_FILE" >/dev/null
          echo "$PLAN_SHA256  $PLAN_FILE" | sha256sum --check -

      - name: Create scoped GitHub App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homelab
          permission-administration: write

      - name: Apply exact saved plan
        shell: bash
        working-directory: ${{ env.WORKING_DIR }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TG_NON_INTERACTIVE: true
          TF_IN_AUTOMATION: 1
          PLAN_FILE: ${{ runner.temp }}/homelab-plan-reviewer.tfplan
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin main
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          policy="$GITHUB_WORKSPACE/Stuhlmuller/repositories/homelab-plan-reviewer-policy.jq"
          terragrunt show -json "$PLAN_FILE" > plan.json
          jq -e -S -c --arg source plan --arg phase before -f "$policy" plan.json > plan-before.json
          jq -e -S -c --arg source plan --arg phase after -f "$policy" plan.json > plan-after.json
          gh api repos/Stuhlmuller/homelab/environments/homelab-plan > live-before.json
          jq -e -S -c --arg source live -f "$policy" live-before.json > live-before-normalized.json
          cmp plan-before.json live-before-normalized.json
          terragrunt apply "$PLAN_FILE"

      - name: Verify live reviewer
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          policy="$GITHUB_WORKSPACE/Stuhlmuller/repositories/homelab-plan-reviewer-policy.jq"
          gh api repos/Stuhlmuller/homelab/environments/homelab-plan > live-after.json
          jq -e -S -c --arg source live -f "$policy" live-after.json > live-after-normalized.json
          cmp "$WORKING_DIR/plan-after.json" live-after-normalized.json

      - name: Delete verified saved plan
        shell: bash
        run: |
          set -euo pipefail
          aws s3api delete-object \
            --bucket "$PLAN_BUCKET" --key "$PLAN_KEY" --version-id "$PLAN_VERSION_ID" >/dev/null
          aws s3api list-object-versions --bucket "$PLAN_BUCKET" --prefix "$PLAN_KEY" > plan-versions.json
          jq -e --arg key "$PLAN_KEY" '
            ([.Versions[]? | select(.Key == $key)] | length) == 0
            and ([.DeleteMarkers[]? | select(.Key == $key)] | length) == 0
          ' plan-versions.json >/dev/null
